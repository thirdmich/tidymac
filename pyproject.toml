[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tidymac"
version = "0.1.0"
description = "Safe disk cleanup tool for Mac and Windows — find large files, duplicates, and clutter"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "thirdmich"}, {name = "FusionICT"}]
keywords = ["cleanup", "disk", "storage", "duplicates", "macos", "windows", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "send2trash>=1.8",
    "xxhash>=3.0",
]

[project.urls]
Homepage = "https://github.com/thirdmich/tidymac"
Repository = "https://github.com/thirdmich/tidymac"
FusionICT = "https://fusionict.com"

[project.scripts]
tidymac = "tidymac.cli:cli"

[tool.setuptools.packages.find]
include = ["tidymac*"]
